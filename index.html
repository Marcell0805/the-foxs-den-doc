<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Fox's Den has moved</title>
  <style>
    :root {
      --bg: #0c1410;
      --panel: #152019;
      --text: #f3ead8;
      --muted: #c9a06a;
      --accent: #e08a45;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    main {
      max-width: 36rem;
      background: var(--panel);
      padding: 2rem 1.75rem;
      border-radius: 12px;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.6rem;
    }
    p {
      margin: 0 0 1rem;
      line-height: 1.5;
      color: var(--muted);
    }
    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>The Fox's Den has moved</h1>
    <p>Apps, downloads, and updates now live on the FoxByte Labs site.</p>
    <p><a href="https://den.foxbytelabs.co.za">Continue to den.foxbytelabs.co.za</a></p>
  </main>
</body>
</html>
